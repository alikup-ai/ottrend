name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run against current dependency releases. ottrend's core has no
  # dependencies at all, but the OPC UA adapter floats on asyncua>=1.0 and
  # talks to it through five service types; a scheduled build is what turns "a
  # new asyncua major changed one of them" from an invisible problem into a red
  # build. The same gap went unnoticed in otgate for months.
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

jobs:
  # The promise that the core needs nothing: protocol, derived queries,
  # MemoryTrend and the OPC UA request/response translation all tested with no
  # OPC UA stack installed.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev only, no asyncua)
        run: pip install -e ".[dev]"
      - name: Run unit tests (excluding integration)
        run: pytest -m "not integration" -q

  # The OPC UA HA adapter against a real asyncua server over opc.tcp://,
  # including the two cases that only a real server shows: a processed read
  # refused with BadNotImplemented, and an unknown node answered Good+empty.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with the opcua extra)
        run: pip install -e ".[dev,opcua]"
      - name: Run integration tests (real OPC UA)
        run: pytest -m integration -q
